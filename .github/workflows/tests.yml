name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        laravel: ['10', '11', '12', '13']
        dependency-version: [prefer-lowest, prefer-stable]
        include:
          - laravel: '10'
            testbench: '8'
          - laravel: '11'
            testbench: '9'
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
        # PHP ranges follow the Laravel support policy: https://laravel.com/docs/releases#support-policy
        exclude:
          - laravel: '10'
            php: '8.4'
          - laravel: '10'
            php: '8.5'
          - laravel: '11'
            php: '8.1'
          - laravel: '11'
            php: '8.5'
          - laravel: '12'
            php: '8.1'
          - laravel: '13'
            php: '8.1'
          - laravel: '13'
            php: '8.2'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, dom, libxml
          tools: composer:v2
          coverage: none

      # Laravel 10 and 11 are past end of life and every release carries a security advisory,
      # so Composer's default blocking would refuse to install them.
      - name: Install dependencies
        run: >
          composer update
          --${{ matrix.dependency-version }}
          --prefer-dist
          --no-interaction
          --no-progress
          --no-security-blocking
          --with="illuminate/support:^${{ matrix.laravel }}"
          --with="orchestra/testbench:^${{ matrix.testbench }}"

      - name: List installed versions
        run: composer show | grep -E '^(laravel/framework|orchestra/testbench|phpunit/phpunit|opensearch-project/opensearch-php) '

      - name: Run tests
        run: vendor/bin/phpunit tests
